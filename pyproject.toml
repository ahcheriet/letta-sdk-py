[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "letta-sdk-py"
version = "0.2.0"
description = "A pythonic SDK for working with Letta agents (Letta Code app server, agent SDK v2)"
readme = "Readme.md"
requires-python = ">=3.11"
dependencies = [
  "websockets>=12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
